spring.application.name=smartserve-backend
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/smartserve?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
springdoc.swagger-ui.path=/swagger-ui.html
smartserve.jwt.secret=${SMARTSERVE_JWT_SECRET:SmartServeLocalSecretKey-ChangeForProduction-2026-SmartServe}
smartserve.jwt.expiration=86400000
